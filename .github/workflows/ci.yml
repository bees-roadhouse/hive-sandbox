name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The born-green gate: the same script a laptop runs, against the same shape
  # of Postgres. scripts/gate-rust.sh refuses without a database, names every
  # test that skipped, and rebuilds web/dist to refuse a stale committed build.
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HIVE_SANDBOX_TEST_DATABASE_URL: postgres://hive:hive@localhost:5432/hive_sandbox_test
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact version; the action installs that one
      # (the guests job needs the exact patch, or the committed .wasm differs).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Mirrors what scripts/db-up.sh does locally. Extensions live in their own
      # schema so `public` stays empty and a test's private schema is the only
      # thing on its search path; migration one creates no extensions.
      - name: provision extensions schema
        env:
          PGPASSWORD: hive
        run: |
          psql -h localhost -U hive -d hive_sandbox_test -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS extensions" \
            -c "CREATE EXTENSION IF NOT EXISTS vector SCHEMA extensions"

      - name: gate
        run: ./scripts/gate-rust.sh

  # Separate from `gate` on purpose: this job downloads a ~115 MB browser, and a
  # lint failure should not wait behind it. The daemon serves /events off
  # Postgres, so the browser specs need one.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each Playwright worker creates its own schema on this database and
      # drops it afterwards, so workers cannot see each other's events. These
      # specs assert on what a stream did NOT deliver, and a stray event would
      # look like a filter bug.
      HIVE_SANDBOX_TEST_DATABASE_URL: postgres://hive:hive@localhost:5432/hive_sandbox_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: provision extensions schema
        env:
          PGPASSWORD: hive
        run: |
          psql -h localhost -U hive -d hive_sandbox_test -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS extensions" \
            -c "CREATE EXTENSION IF NOT EXISTS vector SCHEMA extensions"

      # Built here rather than in globalSetup so the cargo cache above covers
      # it and a compile error reads as a build failure, not a Playwright one.
      - name: build the daemon
        run: cargo build -p hive-sandbox

      - name: install
        working-directory: test/e2e
        run: npm ci

      - name: typecheck
        working-directory: test/e2e
        run: npm run typecheck

      - name: install chromium
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: e2e
        working-directory: test/e2e
        env:
          HIVE_SANDBOX_E2E_BINARY: ${{ github.workspace }}/target/debug/hive-sandbox
        run: npx playwright test

      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

  # The guest source and the committed .wasm drifting apart is what this job
  # catches: the gate tests run against the checked-in artifact, so a change to
  # apps/hello that nobody rebuilt would pass. This rebuilds from source with
  # the pinned toolchain, refuses a diff, and runs the host suite against the
  # fresh bytes.
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guest

      - name: rebuild guests from source
        run: ./scripts/build-guests.sh

      # On a mismatch the step says WHERE the bytes differ, not only that they
      # do: a one-byte drift between two toolchain patch levels is invisible in
      # a diff --stat and obvious in a strings diff.
      - name: the committed guest matches its source
        run: |
          if ! git diff --quiet -- crates/hive-wasmhost/testdata; then
            echo "crates/hive-wasmhost/testdata is out of date with apps/; commit the rebuilt files:"
            git --no-pager diff --stat -- crates/hive-wasmhost/testdata
            for f in $(git diff --name-only -- crates/hive-wasmhost/testdata); do
              git show "HEAD:$f" > /tmp/committed.wasm
              echo "== $f: first differing bytes (offset, committed, rebuilt)"
              cmp -l /tmp/committed.wasm "$f" | head -20 || true
              echo "== $f: strings that differ (< committed, > rebuilt)"
              diff <(strings -n 6 /tmp/committed.wasm) <(strings -n 6 "$f") | head -40 || true
            done
            exit 1
          fi

      - name: guest crates are fmt and clippy clean
        working-directory: guest
        run: cargo fmt --all --check && cargo clippy --workspace --target wasm32-wasip1 -- -D warnings

      - name: host suite against the fresh guest
        run: cargo test -p hive-wasmhost -p hive-registry

  # The egress claim ... a harness has no route out and an agent that ignores
  # HTTP_PROXY fails rather than escapes ... is proven by exactly one test, and
  # it runs only where the images exist. This job builds them and pins them
  # in-job, where the digest is real for this run, and sets
  # HIVE_SANDBOX_REQUIRE_CONTAINER_TESTS so a precondition that is not met
  # FAILS rather than skips. A skip is right on a laptop that never built a
  # harness; it is wrong in the one environment that promised to.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: podman version
        run: podman version

      # Only the claude runtime: the egress test drives one image, and building
      # three would triple the job for nothing.
      - name: build the harness image
        run: ./scripts/harness-build.sh claude

      - name: build the egress proxy image
        run: ./scripts/egress-build.sh

      - name: the pins exist
        run: |
          cat docker/harness/digests.json
          cat docker/egress/digest.json

      - name: container tests, where a skip is a failure
        env:
          HIVE_SANDBOX_REQUIRE_CONTAINER_TESTS: "1"
        run: cargo test -p hive-harness --test supervisor -- podman_runs_the_pinned_image egress_proxy_enforces_the_allowlist

      - name: nothing outlived the run
        if: ${{ always() }}
        run: |
          echo "containers:"
          podman ps --all --filter 'name=hive-sandbox-' --format '{{.Names}}'
          echo "networks:"
          podman network ls --format '{{.Name}}' | grep hive-sandbox || echo "  (none)"

  # The S3 driver against a backend that can actually presign. The disk driver
  # cannot redirect at all, so without Garage every claim about signed URLs is
  # untested by construction. It runs scripts/garage-up.sh rather than a
  # service container, so the script developers depend on is itself under test.
  blobstore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HIVE_SANDBOX_TEST_DATABASE_URL: postgres://hive:hive@localhost:5432/hive_sandbox_test
      # ubuntu-latest ships both; pin the one whose compose is known-good here
      # rather than letting the script's provider detection decide per-runner.
      HIVE_SANDBOX_COMPOSE: "docker compose"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: provision extensions schema
        env:
          PGPASSWORD: hive
        run: |
          psql -h localhost -U hive -d hive_sandbox_test -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS extensions" \
            -c "CREATE EXTENSION IF NOT EXISTS vector SCHEMA extensions"

      # --quiet prints exactly four lines: endpoint, bucket, key id, secret.
      # The key is minted by this Garage seconds ago and dies with the runner.
      - name: start garage
        run: |
          {
            read -r endpoint
            read -r bucket
            read -r key_id
            read -r secret
          } < <(./scripts/garage-up.sh --quiet)
          if [ -z "$endpoint" ] || [ -z "$secret" ]; then
            echo "garage-up did not print credentials"
            exit 1
          fi
          echo "HIVE_SANDBOX_TEST_S3_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "HIVE_SANDBOX_TEST_S3_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "::add-mask::$key_id"
          echo "::add-mask::$secret"
          echo "HIVE_SANDBOX_TEST_S3_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "HIVE_SANDBOX_TEST_S3_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"

      - name: S3 driver tests, where a skip is a failure
        env:
          HIVE_SANDBOX_REQUIRE_CONTAINER_TESTS: "1"
        run: cargo test -p hive-blob --test s3_live -- --nocapture

      - name: garage-up is idempotent
        run: ./scripts/garage-up.sh

      - name: stop garage
        if: ${{ always() }}
        run: ./scripts/garage-down.sh --purge
