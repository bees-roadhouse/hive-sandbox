# The reference guest: the smallest app that exercises every part of the ABI,
# and the fixture the host's conformance tests run.
#
# Its own workspace for the same reason the SDK is: a wasm32-wasip1-only crate
# cannot live inside the host workspace without breaking `cargo build`.
[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
hive-guest = { path = "../../guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Every setting here is load-bearing; scripts/guest-build.md says why.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# A panic is a trap, and the message still reaches stderr (the daemon log)
# before the unwind would have started. Unwinding needs a runtime the guest
# has no use for.
panic = "abort"
strip = true
