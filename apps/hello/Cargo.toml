# The reference guest: the smallest app that exercises every part of the ABI,
# and the fixture the host's conformance tests run.
#
# A member of the guest workspace rooted at guest/Cargo.toml, which is where
# the profile every guest builds with lives and why the build is reproducible
# (see the note there). Not part of the host workspace.
[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
workspace = "../../guest"

[lib]
crate-type = ["cdylib"]

[dependencies]
hive-guest = { path = "../../guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
