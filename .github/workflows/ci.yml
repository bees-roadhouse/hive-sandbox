name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive_sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests skip themselves when this is unset, so unit tests
      # still run anywhere.
      HIVE_SANDBOX_TEST_DATABASE_URL: postgres://hive:hive@localhost:5432/hive_sandbox_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Built from source with the runner's Go rather than downloading a
      # prebuilt binary: a golangci-lint compiled with an older Go refuses to
      # load a config targeting a newer one, which is exactly what broke the
      # first CI run here.
      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run

      # After lint, because lint autofix can reformat.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: test
        run: go test -race ./...
