<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <span id="state-pill" class="pill">…</span>
  <span id="identity"></span>
  <button id="forget" class="ghost hidden" title="Remove this server and its token from this machine">forget server</button>
</header>

<main>
  <section id="setup" class="card hidden">
    <h1>Connect to your hive</h1>
    <label>Server address
      <input id="server-url" type="url" placeholder="http://home.lan:7979">
    </label>
    <button id="probe">Check</button>
    <p id="probe-result" class="hint"></p>

    <label class="hidden" id="token-row">Operator or bootstrap token
      <input id="issuer-token" type="password" autocomplete="off"
             placeholder="exchanged once for a device token, never stored">
    </label>
    <button id="enroll" class="primary hidden">Connect</button>
    <button id="resume" class="hidden">Reconnect</button>
    <p class="hint">
      The token is used once and forgotten; this device keeps only its own
      credential in the system keyring.
    </p>
  </section>

  <section id="events-pane" class="hidden">
    <h1>Live events</h1>
    <table id="events"><tbody></tbody></table>
  </section>

  <section id="notice" class="card hidden"></section>
</main>

<script src="app.js"></script>
</body>
</html>
